name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party action, so it is pinned by commit SHA. The Bun version is the "packageManager"
      # field of the root package.json (bun@1.3.10): one pin for local runs and CI.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # Node-based tools (Vite, tsc, Vitest, Biome) run on this Node, not on Bun.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Check the installed Bun matches the pin
        run: |
          test "$(bun --version)" = "$(jq -r '.packageManager | split("@")[1]' package.json)"
          echo "bun $(bun --version), node $(node --version)"

      # --frozen-lockfile alone passes when bun.lock is missing, so check the file exists first.
      - name: Install
        run: test -f bun.lock && bun install --frozen-lockfile

      - run: bun run check
      - run: bun run typecheck
      - run: bun run test:coverage

  # The build-time pipeline: audio prep, the consent gate, transcript comparison. ffmpeg comes from
  # the pinned imageio-ffmpeg wheel, so there is no system install. Real recordings are not in
  # git, so these tests run on generated signals.
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party action, pinned by commit SHA (v10.2.0, verified with `gh api`).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.26"

      - run: uv sync --frozen
      - run: uv run pytest

  # The pinned e5 model (118 MB model plus 17 MB tokenizer) is downloaded once per revision and
  # cached, then the embedding, fixture and evaluation checks run on the real files. Kept out of
  # `verify` so the fast path stays offline and cannot be broken by a Hugging Face outage.
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install
        run: test -f bun.lock && bun install --frozen-lockfile

      - uses: actions/cache@v6
        with:
          path: .cache/models
          key: e5-model-${{ hashFiles('packages/pack/model.lock.json') }}

      # Downloads only what is missing and verifies every file against model.lock.json.
      - run: bun run pack:model
      - run: bun run test:model
