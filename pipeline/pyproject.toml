[project]
name = "asknoor-pipeline"
version = "0.0.0"
description = "Ask Noor build-time pipeline: audio prep, transcripts and farm packs. Never runs at guest runtime."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.2",
  "httpx==0.28.1",
  "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
dev = ["pytest==8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asknoor"]
