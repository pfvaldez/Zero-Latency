[project]
name = "asknoor-pipeline"
version = "0.0.0"
description = "Ask Noor build-time pipeline: audio prep, transcripts and farm packs. Never runs at guest runtime."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.2",
  "httpx==0.28.1",
  "imageio-ffmpeg==0.6.0",
]

[dependency-groups]
# Light and needed by the evidence tests, so CI installs them.
dev = [
    "pytest==8.4.1",
    "jiwer==4.0.0",
    "pyarrow==25.0.1",
    "sacrebleu==2.6.0",
    "onnx==1.23.1",
    "onnxruntime==1.30.0",
    "tokenizers==0.23.2",
]
# Heavy (several GB of models): the translation drafts and the Wolof evidence runs. Never in CI.
translate = [
    "torch==2.14.1",
    "transformers==5.18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs the real NLLB model (several GB); local only, never in CI"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asknoor"]
